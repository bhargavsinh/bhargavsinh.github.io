<script>
function clearInput() {
  var el = document.getElementById('raw-input');
  if (el) el.value = '';
  var disp = document.getElementById('prompt-display');
  if (disp) disp.textContent = 'Awaiting parameters to construct 7-Layer Architecture...';
  var st = document.getElementById('status-text');
  if (st) st.textContent = 'Status: Idle';
  var wc = document.getElementById('word-count');
  if (wc) wc.textContent = 'Est. Length: 0 Words';
}

function generateDeepPrompt() {
  var raw = (document.getElementById('raw-input') || {}).value || '';
  var target = (document.getElementById('target') || {}).value || 'General AI';
  var tone = (document.getElementById('tone') || {}).value || 'Professional';
  var format = (document.getElementById('format') || {}).value || 'Structured';
  var loader = document.getElementById('loader');
  var disp = document.getElementById('prompt-display');
  var st = document.getElementById('status-text');
  var wc = document.getElementById('word-count');

  if (!raw.trim()) {
    alert('Please enter your core idea or parameters first.');
    return;
  }

  if (loader) loader.classList.remove('hidden');
  if (st) st.textContent = 'Status: Synthesizing...';

  setTimeout(function() {
    var prompt = [
      '=== 7-LAYER DEEP PROMPT ARCHITECTURE ===',
      '',
      '[1. ROLE]',
      'You are an expert specialist optimized for: ' + target + '.',
      '',
      '[2. CONTEXT]',
      raw.trim(),
      '',
      '[3. OBJECTIVE]',
      'Produce a high-quality, complete response that fully addresses the context above.',
      '',
      '[4. TONE]',
      'Adopt a ' + tone + ' tone throughout.',
      '',
      '[5. FORMAT]',
      'Structure the output as: ' + format + '.',
      '',
      '[6. CONSTRAINTS]',
      '- Be accurate and specific.',
      '- Avoid filler and unsupported claims.',
      '- If information is uncertain, state assumptions clearly.',
      '',
      '[7. QUALITY BAR]',
      'Prioritize clarity, usefulness, and completeness. End with a brief self-check of whether the objective was met.',
      '',
      '=== END ARCHITECTURE ==='
    ].join('\\n');

    if (disp) {
      disp.textContent = prompt;
      disp.classList.remove('text-slate-500');
      disp.classList.add('text-slate-200');
    }
    if (st) st.textContent = 'Status: Ready';
    if (wc) {
      var words = prompt.trim().split(/\\s+/).length;
      wc.textContent = 'Est. Length: ' + words + ' Words';
    }
    if (loader) loader.classList.add('hidden');
  }, 600);
}

function copyToClipboard() {
  var disp = document.getElementById('prompt-display');
  if (!disp) return;
  var text = disp.textContent || '';
  if (!text || text.indexOf('Awaiting') === 0) {
    alert('Nothing to copy yet. Generate a prompt first.');
    return;
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() {
      var st = document.getElementById('status-text');
      if (st) st.textContent = 'Status: Copied to clipboard';
    }).catch(function() {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
  var st = document.getElementById('status-text');
  if (st) st.textContent = 'Status: Copied to clipboard';
}
</script>
