<!-- LIMITATION: meta CSP does not enforce frame-ancestors; use only as defence-in-depth on static hosts. -->
<!-- V17.0 Security meta (include in <head> if not using JS injector) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.tailwindcss.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self'; base-uri 'self'; form-action 'self' https:; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="permissions-policy" content="camera=(), microphone=(), geolocation=(), payment=()">
