<script>
(function(){
  const toggle = document.getElementById("menu-toggle");
  const mobileNav = document.getElementById("mobile-nav");
  const closeBtn = document.getElementById("mobile-nav-close");
  if (!toggle || !mobileNav) return;
  const open = () => { mobileNav.classList.add("open"); mobileNav.setAttribute("aria-hidden","false"); document.body.style.overflow="hidden"; };
  const close = () => { mobileNav.classList.remove("open"); mobileNav.setAttribute("aria-hidden","true"); document.body.style.overflow=""; };
  toggle.addEventListener("click", open);
  if (closeBtn) closeBtn.addEventListener("click", close);
  mobileNav.addEventListener("click", e => { if (e.target === mobileNav) close(); });
  mobileNav.querySelectorAll("a").forEach(a => a.addEventListener("click", close));
  document.addEventListener("keydown", e => { if (e.key === "Escape" && mobileNav.classList.contains("open")) close(); });
})();
</script>
