name: Wire bento-editorial layout

on:
  push:
    paths:
      - '.github/workflows/wire-bento.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link bento-editorial.css on every HTML (no text content changes)
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re

          def prefix_for(path: Path) -> str:
              depth = len(path.parts) - 1
              return '' if depth <= 0 else '../' * depth

          changed = 0
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts or '.github' in p.parts:
                  continue
              text = p.read_text(encoding='utf-8', errors='replace')
              orig = text

              # Skip if already linked
              if 'bento-editorial.css' in text:
                  continue

              pref = prefix_for(p)
              link = f'<link rel="stylesheet" href="{pref}assets/css/bento-editorial.css?v=18.2.0">'

              # Prefer insert after site.css
              if re.search(r'site\.css[^>]*>', text):
                  text = re.sub(
                      r'(href="[^"]*site\.css[^"]*"[^>]*>)',
                      r'\1\n  ' + link,
                      text,
                      count=1,
                  )
              elif '</head>' in text:
                  text = text.replace('</head>', '  ' + link + '\n</head>', 1)
              else:
                  print('skip no head', p)
                  continue

              if text != orig:
                  # Safety: body text markers should be unchanged outside head
                  # Compare body payloads
                  def body(s):
                      m = re.search(r'<body[^>]*>(.*)</body>', s, re.S | re.I)
                      return m.group(1) if m else s
                  b0, b1 = body(orig), body(text)
                  # Allow only if body identical (layout CSS in head only)
                  if b0 != b1:
                      print('ABORT body changed', p)
                      continue
                  p.write_text(text, encoding='utf-8')
                  changed += 1
                  print('wired', p)

          assert Path('assets/css/bento-editorial.css').exists()
          print('CHANGED', changed)
          PY

      - name: Quick CSS sanity
        run: |
          grep -q 'Bento Box' assets/css/bento-editorial.css
          grep -q 'grid-template-columns: repeat(12' assets/css/bento-editorial.css
          test -f index.html
          grep -q 'bento-editorial.css' index.html

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short | head -40
          git commit -m "V18.2.0: apply bento-box + editorial scroll layout on all pages (no text changes)" || exit 0
          git push origin HEAD:main
