name: Hotfix restore site.js with protection

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hotfix-site-js.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore site.js from last good deploy and enhance protection
        run: |
          set -euo pipefail
          # Last known good full site.js (pre-truncation)
          git show 61d47987971d830dc7d69305af276be1feba3a46:assets/js/site.js > assets/js/site.js
          test -s assets/js/site.js
          python3 << 'PY'
          from pathlib import Path
          js = Path('assets/js/site.js').read_text(encoding='utf-8')
          old = """  // ---- Content protection (deterrence only; see README) -------------------
  safe(function () {
    if (!PROTECT || !doc.body.hasAttribute('data-protect')) return;
    function editable(t) { return t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable || (t.closest && t.closest('[data-allow-copy]'))); }
    ['copy', 'cut', 'contextmenu'].forEach(function (ev) { on(doc, ev, function (e) { if (!editable(e.target)) e.preventDefault(); }, true); });
    on(doc, 'dragstart', function (e) { if (e.target && e.target.tagName === 'IMG') e.preventDefault(); }, true);
    $$('img').forEach(function (i) { i.classList.add('protected'); i.draggable = false; });
  });"""
          new = """  // ---- Content protection + soft DRM deterrence (see README) --------------
  // Not cryptographic DRM (impossible on static HTML). Deterrence only:
  // site-wide image shield; full text shield on body[data-protect].
  safe(function () {
    if (!PROTECT) return;
    function editable(t) {
      if (!t) return false;
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return true;
      if (t.isContentEditable) return true;
      if (t.closest && t.closest('[data-allow-copy], .allow-copy, #search, .search')) return true;
      return false;
    }
    function isImg(t) { return t && (t.tagName === 'IMG' || (t.closest && t.closest('img, picture, .portal-img, .book-cover, .card-cover, .hero-media'))); }

    // Site-wide: images never drag
    $$('img').forEach(function (i) {
      i.classList.add('protected');
      i.setAttribute('draggable', 'false');
      if (!i.getAttribute('loading') && !i.closest('.intro, .ps-brand')) i.setAttribute('loading', 'lazy');
    });
    on(doc, 'dragstart', function (e) { if (isImg(e.target)) e.preventDefault(); }, true);

    var locked = doc.body.hasAttribute('data-protect');
    if (!locked) return;

    doc.body.classList.add('is-protected');
    ['copy', 'cut', 'contextmenu', 'selectstart'].forEach(function (ev) {
      on(doc, ev, function (e) {
        if (editable(e.target)) return;
        if (ev === 'contextmenu' && !isImg(e.target) && e.target && e.target.closest && e.target.closest('a, button, [data-search]')) return;
        e.preventDefault();
      }, true);
    });
    on(doc, 'keydown', function (e) {
      if (editable(e.target)) return;
      var k = (e.key || '').toLowerCase();
      var block = (e.ctrlKey || e.metaKey) && (k === 's' || k === 'u' || k === 'p');
      if (block) e.preventDefault();
    }, true);
  });"""
          if old not in js:
              raise SystemExit('protection block missing in restored file')
          js = js.replace(old, new)
          js = js.replace(
              "var PROTECT = true;            // deterrence on author's original long-form pages (body[data-protect]); set false to disable",
              "var PROTECT = true;            // content protection + soft DRM deterrence; set false to disable globally")
          Path('assets/js/site.js').write_text(js, encoding='utf-8')
          print('patched', len(js))
          PY

          # CSS protection rules
          if ! grep -q 'body.is-protected' assets/css/site.css 2>/dev/null; then
            cat >> assets/css/site.css << 'CSS'

/* ---------- Content protection / soft DRM deterrence ---------- */
img.protected,
picture img {
  -webkit-user-drag: none;
  user-select: none;
  -webkit-touch-callout: none;
}
body[data-protect],
body.is-protected {
  -webkit-user-select: none;
  -moz-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
body[data-protect] input,
body[data-protect] textarea,
body[data-protect] select,
body[data-protect] [contenteditable="true"],
body[data-protect] [data-allow-copy],
body[data-protect] .allow-copy,
body[data-protect] #search,
body[data-protect] .search,
body[data-protect] .search * {
  -webkit-user-select: text;
  -moz-user-select: text;
  user-select: text;
  -webkit-touch-callout: default;
}
@media print {
  body[data-protect]::after {
    content: "© BHARGAVSINH SISODIYA — https://bhargavsinh.github.io — Personal / educational use only.";
    display: block;
    margin-top: 2rem;
    font-size: 10pt;
    color: #444;
  }
}
CSS
          fi

          # Mark original content pages with data-protect (body attribute only)
          python3 << 'PY'
          from pathlib import Path
          import re
          targets = [
            'Visitor/ananadviharbhavan.html',
            'Book-Publications-Reader/satyanisodh.html',
            'Book-Publications-Reader/astitva-garima.html',
            'Book-Publications-Reader/mahabharat-rajdharma.html',
            'Book-Publications-Reader/pushtimarg.html',
            'Book-Publications-Reader/bookreadingpolicy.html',
            'HR-Recruiter/ghostwriting.html',
          ]
          for p in targets:
            path = Path(p)
            if not path.exists():
              print('skip missing', p)
              continue
            html = path.read_text(encoding='utf-8')
            m = re.search(r'<body([^>]*)>', html)
            if not m:
              continue
            if 'data-protect' in m.group(1):
              print('already', p)
              continue
            new_body = '<body' + m.group(1) + ' data-protect>'
            path.write_text(html[:m.start()] + new_body + html[m.end():], encoding='utf-8')
            print('marked', p)
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo 'no changes' && exit 0
          git commit -m "V18.1.1: content protection + soft DRM deterrence (restore site.js, CSS, data-protect pages)"
          git push origin HEAD:main
