name: Final L4 clean

on:
  push:
    paths:
      - '.github/workflows/final-l4-clean.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: String-replace all broken L4 script forms
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re

          def prefix_for(path: Path) -> str:
              depth = len(path.parts) - 1
              return '' if depth <= 0 else '../' * depth

          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts or '.github' in p.parts:
                  continue
              text = p.read_text(encoding='utf-8', errors='replace')
              pref = prefix_for(p)
              good = f'<script src="{pref}assets/js/protect-l4.js?v=18.1.3" defer></script>'
              good_css = f'<link rel="stylesheet" href="{pref}assets/css/protect-l4.css?v=18.1.3">'

              # Nuke every line/tag mentioning protect-l4.js
              lines = []
              for line in text.splitlines(keepends=True):
                  if 'protect-l4.js' in line:
                      continue
                  lines.append(line)
              text = ''.join(lines)

              # Also remove protect-l4.css lines to re-add once
              lines = []
              for line in text.splitlines(keepends=True):
                  if 'protect-l4.css' in line:
                      continue
                  lines.append(line)
              text = ''.join(lines)

              text = text.replace('</script></script>', '</script>')

              # data-protect
              m = re.search(r'<body([^>]*)>', text)
              if m and 'data-protect' not in m.group(1):
                  text = text[:m.start()] + '<body' + m.group(1) + ' data-protect>' + text[m.end():]

              if '</head>' in text:
                  text = text.replace('</head>', f'  {good_css}\n</head>', 1)
              if '</body>' in text:
                  text = text.replace('</body>', f'  {good}\n</body>', 1)

              p.write_text(text, encoding='utf-8')

          # Verify
          for sample in Path('.').rglob('*.html'):
              if '.git' in sample.parts or '.github' in sample.parts:
                  continue
              t = sample.read_text(encoding='utf-8')
              assert 'protect-l4.js' in t, sample
              assert t.count('protect-l4.js') == 1, (sample, t.count('protect-l4.js'))
              assert 'defer>>' not in t, sample
              assert '</script></script>' not in t, sample
              assert 'data-protect' in t, sample
          print('ALL_OK', sum(1 for _ in Path('.').rglob('*.html')))
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V18.1.3: Level-4 content security — clean tags on all HTML pages" || exit 0
          git push origin HEAD:main
