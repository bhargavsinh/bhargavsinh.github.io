name: retro-all-pages
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject retro + L4 on all HTML
        run: |
          python3 << 'PY'
          import re
          from pathlib import Path
          skip = {'google424fbe164e6bb481.html'}
          changed = 0
          for path in Path('.').rglob('*.html'):
            sp = str(path).replace('\\', '/')
            if 'partials' in sp or '.github' in sp or path.name in skip:
              continue
            html = path.read_text(encoding='utf-8', errors='replace')
            if 'http-equiv="refresh"' in html.lower() and len(html) < 800:
              continue
            depth = sp.count('/')
            root = '../' * depth
            orig = html
            if 'retro-2000s.css' not in html:
              html = re.sub(r'</head>', f'<link rel="stylesheet" href="{root}assets/css/retro-2000s.css?v=20.3.0">\n<link rel="stylesheet" href="{root}assets/css/protect-l4.css?v=18.1.3">\n</head>', html, count=1, flags=re.I)
            elif 'protect-l4.css' not in html:
              html = re.sub(r'</head>', f'<link rel="stylesheet" href="{root}assets/css/protect-l4.css?v=18.1.3">\n</head>', html, count=1, flags=re.I)
            if re.search(r'<body[^>]*data-protect', html, re.I) is None:
              html = re.sub(r'<body([^>]*)>', r'<body\1 data-protect>', html, count=1, flags=re.I)
            scripts = ''
            if 'protect-l4.js' not in html:
              scripts += f'<script src="{root}assets/js/protect-l4.js?v=18.1.3"></script>\n'
            if 'retro-apply.js' not in html:
              scripts += f'<script src="{root}assets/js/retro-apply.js?v=20.3.0"></script>\n'
            if scripts:
              html = re.sub(r'</body>', scripts + '</body>', html, count=1, flags=re.I)
            if html != orig:
              path.write_text(html, encoding='utf-8')
              changed += 1
              print('updated', sp)
          print('total', changed)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Apply Early 2000s + Level-4 security to all HTML pages"
          git push
