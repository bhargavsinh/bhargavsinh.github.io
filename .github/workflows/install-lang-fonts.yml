name: install-lang-fonts
on:
  workflow_dispatch:
jobs:
  fonts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Adishila + inject CSS links
        run: |
          mkdir -p assets/fonts
          curl -sL -o assets/fonts/Adishila.ttf "https://adishila.com/wp-content/uploads/2020/05/Adishila.ttf"
          python3 -c "from fontTools.ttLib import TTFont; f=TTFont('assets/fonts/Adishila.ttf'); f.flavor='woff'; f.save('assets/fonts/Adishila.woff')" || true
          ls -la assets/fonts/
          python3 << 'PY'
          from pathlib import Path
          import re
          link = '<link rel="stylesheet" href="ROOT assets/css/lang-fonts.css?v=20.4.3">'.replace('ROOT ', '')
          # Better: depth-aware
          n = 0
          for p in Path('.').rglob('*.html'):
            sp = str(p).replace('\\','/')
            if '.github' in sp:
              continue
            h = p.read_text(encoding='utf-8', errors='replace')
            if 'lang-fonts.css' in h:
              continue
            depth = sp.count('/')
            root = '../' * depth
            tag = f'<link rel="stylesheet" href="{root}assets/css/lang-fonts.css?v=20.4.3">'
            if '</head>' in h.lower():
              h2 = re.sub(r'</head>', tag + '\n</head>', h, count=1, flags=re.I)
              p.write_text(h2, encoding='utf-8')
              n += 1
              print('linked', sp)
          print('total', n)
          # Update site.css variables if present
          sc = Path('assets/css/site.css')
          if sc.exists():
            t = sc.read_text(encoding='utf-8')
            t2 = t
            t2 = re.sub(r'--font-ui:\s*[^;]+;', '--font-ui: "Lora", "Times New Roman", Times, serif;', t2, count=1)
            t2 = re.sub(r'--font-display:\s*[^;]+;', '--font-display: "Lora", "Times New Roman", Times, serif;', t2, count=1)
            if t2 != t:
              sc.write_text(t2, encoding='utf-8')
              print('site.css fonts updated')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Install Adishila font files + link lang-fonts.css on all HTML"
          git push
