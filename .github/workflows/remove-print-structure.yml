name: remove-print-structure
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove print buttons
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re
          n = 0
          for path in Path('.').rglob('*.html'):
            if '.github' in str(path):
              continue
            t = path.read_text(encoding='utf-8', errors='replace')
            o = t
            t = t.replace('onclick="window.print()"', '')
            t = re.sub(r'<button([^>]*)>\s*Print page\s*</button>', '', t, flags=re.I)
            t = re.sub(r'<a[^>]*javascript:window\.print\(\)[^>]*>\s*Print[^<]*</a>', '', t, flags=re.I)
            t = t.replace('javascript:window.print()', '#')
            if t != o:
              path.write_text(t, encoding='utf-8')
              n += 1
              print('fixed', path)
          print('total', n)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Remove all page-print buttons sitewide"
          git push
