name: Deploy Policies V2.0

on:
  push:
    paths:
      - '.github/workflows/policies-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write Policy Suite V2.0 into all policy HTML pages
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re

          EFF = "08 November 2026"
          GO_NAME = "Bhargavsinh Sisodiya"
          GO_EMAIL = "bhargavsinh.bca@gmail.com"

          def go(gujarati):
              return f'''
          <section class="box">
          <h2 class="accent">7. Contact for Grievance Officer</h2>
          <p>In accordance with <strong>Rule 3(2) of the Information Technology (Intermediary Guidelines and Digital Media Ethics Code) Rules, 2021</strong> and the <strong>Digital Personal Data Protection Act, 2023</strong>:</p>
          <ul>
          <li><strong>Grievance Officer / Data Protection Contact:</strong> {GO_NAME}</li>
          <li><strong>Email:</strong> <a href="mailto:{GO_EMAIL}">{GO_EMAIL}</a></li>
          <li><strong>Website:</strong> <a href="https://bhargavsinh.github.io/">https://bhargavsinh.github.io/</a></li>
          <li><strong>Acknowledgement:</strong> within <strong>fifteen (15) days</strong> of a complete written complaint.</li>
          <li><strong>Resolution endeavour:</strong> ordinarily within <strong>thirty (30) days</strong>.</li>
          </ul>
          <p>Email subject must identify the policy and relief sought. Frivolous complaints may be closed with recorded reasons.</p>
          </section>
          <p class="muted" style="margin-top:1.5rem"><em>Gujarati summary:</em> {gujarati}</p>
          '''

          CP = '''
          <section class="box">
          <h2 class="accent">5. Content Protection Measures</h2>
          <p><strong>Zero Tolerance</strong> for unauthorised copying, scraping, or commercial exploitation. Measures include:</p>
          <ul>
          <li><strong>CSS / UI:</strong> <code>user-select: none</code> on protected pages;</li>
          <li><strong>Anti-copy / anti-cut:</strong> client-side blocking of copy, cut, and context-menu on protected views (inputs and permitted zones excepted);</li>
          <li><strong>Image protection:</strong> drag-disable and protected image classes;</li>
          <li><strong>Watermark / print notice:</strong> ownership notices on print and selected views;</li>
          <li><strong>Soft DRM deterrence:</strong> layered client-side controls (not cryptographic DRM). Circumvention is <strong>Strictly Prohibited</strong> under the Copyright Act, 1957 and the IT Act, 2000 as applicable.</li>
          </ul>
          </section>
          '''

          def pen(extra=""):
              return f'''
          <section class="box">
          <h2 class="accent">6. Penalties for Violation</h2>
          <p><strong>Zero Tolerance</strong> for wilful infringement, data misuse, or security circumvention:</p>
          <ul>
          <li>Restriction or blocking of access where feasible;</li>
          <li>Civil remedies under the <strong>Copyright Act, 1957</strong> and <strong>Indian Contract Act, 1872</strong>;</li>
          <li>Proceedings under the <strong>Information Technology Act, 2000</strong> where applicable;</li>
          <li>Reporting to competent authorities when required by law.</li>
          </ul>
          {extra}
          <p>Non-enforcement of any clause does not waive rights.</p>
          </section>
          '''

          def page(title, intro, scope, clauses, rights, gujarati, extra_pen=""):
              return f'''
          <h2 class="kicker accent">Official Documentation · V2.0</h2>
          <h1 class="accent">{title}</h1>
          <p class="muted"><strong>Effective Date:</strong> {EFF} · <strong>Version:</strong> 2.0</p>
          <h2>1. Introduction &amp; Purpose</h2>
          <p>{intro}</p>
          <h2>2. Scope (What is covered)</h2>
          <p>{scope}</p>
          <h2>3. Detailed Clauses with current laws reference</h2>
          {clauses}
          <h2>4. User Rights &amp; Responsibilities</h2>
          <p>{rights}</p>
          {CP}
          {pen(extra_pen)}
          {go(gujarati)}
          '''

          policies = {
          "Visitor/privacy-policy.html": page(
          "Revised Privacy Policy (As per IT Act &amp; DPDP Act 2023) - Version 2.0",
          "This Privacy Policy governs personal data in connection with https://bhargavsinh.github.io/ and is framed for alignment with the <strong>Digital Personal Data Protection Act, 2023</strong>, the <strong>Information Technology Act, 2000</strong>, and the <strong>IT Rules, 2021</strong>, as applicable to a personal digital portfolio. <strong>Strictly Prohibited:</strong> harvesting or misuse of personal data beyond stated purposes.",
          "Visitors; persons submitting forms or email; technical logs from hosting. Static historical/genealogical material about deceased persons is not treated as personal data of living users merely by display.",
          "<p><strong>3.1 Data categories.</strong> Voluntary contact data (name, email, phone, message) via Formspree/email; limited technical logs (IP, user-agent, time) by GitHub Pages/CDN for security and delivery. No Author-operated advertising profiles.</p><p><strong>3.2 Purpose (DPDP Act).</strong> Responding to enquiries, appointments, grievances, security, and legal compliance. <strong>Strictly Prohibited:</strong> sale or monetisation of personal data.</p><p><strong>3.3 Processors.</strong> Formspree and GitHub process data under their terms. Do not submit government IDs or passwords via public forms.</p><p><strong>3.4 Security &amp; children.</strong> Reasonable security for a static site; Site not directed at collecting data from children under 18.</p>",
          "You may request access, correction, erasure, or withdrawal of consent for personal data you provided, by emailing the Grievance Officer. Provide accurate information; <strong>Zero Tolerance</strong> for spam or intrusion.",
          "આ ગોપનીયતા નીતિ DPDP અને IT કાયદા મુજબ છે. અંગત ડેટાનો દુરુપયોગ પ્રતિબંધિત છે. ફરિયાદ: bhargavsinh.bca@gmail.com."
          ),
          "Visitor/termsofuse.html": page(
          "Revised Terms of Use (As per IT Act &amp; DPDP Act 2023) - Version 2.0",
          "These Terms form a binding agreement under the <strong>Indian Contract Act, 1872</strong> with Bhargavsinh Sisodiya. Use of the Site constitutes acceptance.",
          "All portals, pages, forms, and materials under the Author’s control on the Site.",
          "<p><strong>3.1 Licence.</strong> Limited, revocable, non-exclusive licence to view for personal non-commercial use only under the <strong>Copyright Act, 1957</strong>.</p><p><strong>3.2 Strictly Prohibited:</strong> scraping; bulk download; circumvention of protection; republication; commercial exploitation; cyber attacks (IT Act).</p><p><strong>3.3 No professional advice</strong> unless a separate signed engagement exists.</p><p><strong>3.4 Governing law:</strong> India; courts at <strong>Vadodara, Gujarat</strong>, subject to mandatory law.</p>",
          "Browse and contact as offered. Comply with all Site policies. <strong>Zero Tolerance</strong> for infringement and abuse.",
          "સાઇટના નિયમો કરારરૂપે બંધનકર્તા છે. અનધિકૃત કૉપિ/સ્ક્રેપિંગ સખ્ત પ્રતિબંધિત છે."
          ),
          "Visitor/disclaimer.html": page(
          "Revised Disclaimer (As per IT Act &amp; DPDP Act 2023) - Version 2.0",
          "This Disclaimer limits liability consistent with the <strong>Indian Contract Act, 1872</strong> and the <strong>IT Act, 2000</strong>.",
          "All text, images, genealogy extracts, and technical materials on the Site.",
          "<p><strong>3.1 As-is.</strong> Content without warranties of completeness or fitness, except where mandatory law provides otherwise.</p><p><strong>3.2 No advice.</strong> Materials do not create a professional-client relationship.</p><p><strong>3.3 Limitation &amp; indemnity.</strong> To the maximum extent permitted by Indian law, no liability for indirect loss; users indemnify the Author against claims from unlawful use.</p>",
          "Verify information before reliance; use the Site lawfully.",
          "માહિતી ‘યથાવત’ આપવામાં આવે છે; વ્યવસાયિક સલાહ નથી. ગેરકાયદેસર ઉપયોગ પર જવાબદારી વપરાશકર્તાની."
          ),
          "Visitor/grievance.html": page(
          "Revised Grievance Redressal Policy (As per IT Act &amp; DPDP Act 2023) - Version 2.0",
          "Mechanism under <strong>Rule 3(2) of the IT Rules, 2021</strong> and data principal requests under the <strong>DPDP Act, 2023</strong>.",
          "Complaints on content, privacy, copyright, accessibility, and policy breaches.",
          "<p><strong>3.1 Filing.</strong> Written email with identity, facts, URLs, and relief sought.</p><p><strong>3.2 Timelines.</strong> Acknowledge within 15 days; respond ordinarily within 30 days.</p><p><strong>3.3 Strictly Prohibited:</strong> false or harassing complaints.</p>",
          "Right to fair consideration of genuine grievances; duty to provide truthful particulars.",
          "ફરિયાદ લેખિતમાં bhargavsinh.bca@gmail.com પર મોકલો; 15 દિવસમાં સ્વીકૃતિ, સામાન્ય રીતે 30 દિવસમાં જવાબ."
          ),
          "Visitor/cookies-policy.html": page(
          "Revised Cookies Policy (As per IT Act &amp; DPDP Act 2023) - Version 2.0",
          "Explains cookies and local storage under the <strong>DPDP Act, 2023</strong> and <strong>IT Act, 2000</strong>.",
          "Browser storage for UI preferences and any infrastructure cookies.",
          "<p><strong>3.1 Functional storage.</strong> localStorage/sessionStorage for theme, font scale, intro state — not advertising trackers.</p><p><strong>3.2 No Author ad cookies.</strong> Hosting/CDN may process technical data for delivery and security.</p>",
          "Clear site data in the browser to reset preferences.",
          "સાઇટ જાહેરાત કુકીઝ વાપરતી નથી; માત્ર UI પસંદગીઓ માટે local storage."
          ),
          "Visitor/copyright-policy.html": page(
          "Revised Copyright Policy (As per IT Act &amp; DPDP Act 2023) - Version 2.0",
          "Ownership and enforcement under the <strong>Copyright Act, 1957</strong>; personal data issues under the Privacy Policy.",
          "Original literary, artistic, and digital works of Bhargavsinh Sisodiya on the Site.",
          "<p><strong>3.1 Ownership</strong> vests in the Author unless stated otherwise.</p><p><strong>3.2 Strictly Prohibited:</strong> reproduction, adaptation, public communication, or commercial use without written licence; removal of rights-management information; TPM circumvention.</p><p><strong>3.3 Fair dealing</strong> remains as permitted by statute only.</p>",
          "Personal non-commercial viewing is permitted. <strong>Zero Tolerance</strong> for piracy.",
          "કૉપિરાઇટ લેખક પાસે છે. અનધિકૃત પુનઃપ્રકાશન/વેચાણ સખ્ત પ્રતિબંધિત છે.",
          "<p>Statutory and criminal remedies under the Copyright Act may apply to wilful infringement.</p>"
          ),
          "Visitor/content-editorial-policy.html": page(
          "Revised Content Editorial Policy (As per IT Act &amp; DPDP Act 2023) - Version 2.0",
          "Editorial standards and prohibited conduct aligned with the <strong>IT Rules, 2021</strong> and the <strong>IT Act, 2000</strong>.",
          "Author-published content and user submissions via form/email.",
          "<p><strong>3.1 Author content</strong> published in good faith for heritage, literature, and professional presentation.</p><p><strong>3.2 Strictly Prohibited user conduct:</strong> child sexual content; hate; terrorism; defamation; IP theft; malware; unlawful dumps of third-party personal data (IT Act / DPDP Act).</p>",
          "Report unlawful content to the Grievance Officer.",
          "ગેરકાયદેસર/અભદ્ર સામગ્રી અને અન્યના અંગત ડેટાનો દુરુપયોગ પ્રતિબંધિત છે."
          ),
          "Visitor/data-retention-policy.html": page(
          "Revised Data Retention Policy (As per IT Act &amp; DPDP Act 2023) - Version 2.0",
          "Retention and deletion consistent with purpose limitation under the <strong>DPDP Act, 2023</strong>.",
          "Form submissions, email correspondence, and technical logs under practical control.",
          "<p><strong>3.1 Form/email data</strong> retained as needed for response, grievance records, or law; then deleted or restricted.</p><p><strong>3.2 Hosting logs</strong> follow GitHub/CDN practices.</p><p><strong>3.3 Legal hold</strong> where required for disputes or statute.</p>",
          "You may request erasure of personal data you submitted, subject to legal exceptions.",
          "અંગત ડેટા જરૂરિયાત પૂરતો જ રાખવામાં આવે છે; કાઢી નાખવાની વિનંતી ઇમેઇલથી કરી શકાય."
          ),
          "Visitor/third-party-policy.html": page(
          "Revised Third-Party Policy (As per IT Act &amp; DPDP Act 2023) - Version 2.0",
          "Third-party services and responsibility under the <strong>IT Act</strong>, <strong>IT Rules, 2021</strong>, and <strong>DPDP Act, 2023</strong>.",
          "GitHub Pages, Formspree, fonts providers, and outbound links.",
          "<p><strong>3.1 Processors</strong> act under their own terms; the Author does not control their infrastructure.</p><p><strong>3.2 Links</strong> are convenience only.</p><p><strong>3.3 Strictly Prohibited:</strong> using the Site to distribute others’ personal data unlawfully.</p>",
          "Review third-party policies before submitting data to them.",
          "થર્ડ-પાર્ટી સેવાઓની પોતાની નીતિઓ લાગુ પડે છે; અન્યના ડેટાનો ગેરકાયદે શેર પ્રતિબંધિત છે."
          ),
          "Visitor/accessibility-statement.html": page(
          "Revised Accessibility Statement (As per IT Act &amp; DPDP Act 2023) - Version 2.0",
          "Commitment to reasonable accessibility without waiving copyright protection under the <strong>Copyright Act, 1957</strong>.",
          "Public HTML pages and core navigation.",
          "<p><strong>3.1 Measures:</strong> semantic structure, theme options, font scaling, keyboard-reachable controls where implemented.</p><p><strong>3.2 Protection vs access:</strong> copy-protection is not aimed at defeating assistive technology; piracy circumvention remains <strong>Strictly Prohibited</strong>.</p>",
          "Report accessibility barriers to the Grievance Officer.",
          "સાઇટને વધુ સુલભ બનાવવાનો પ્રયાસ છે; કૉપિરાઇટ સુરક્ષા જાળવી રાખવામાં આવે છે."
          ),
          "Book-Publications-Reader/bookreadingpolicy.html": page(
          "Revised Book Reading Policy (As per IT Act &amp; DPDP Act 2023) - Version 2.0",
          "Access to publication pages under the <strong>Copyright Act, 1957</strong>, <strong>IT Act, 2000</strong>, and <strong>Indian Contract Act, 1872</strong>.",
          "Book &amp; Publications portal pages, covers, and related materials.",
          "<p><strong>3.1 Licence:</strong> personal non-commercial viewing only; storefront access governed by those platforms.</p><p><strong>3.2 Strictly Prohibited:</strong> unauthorised reproduction, OCR harvesting, redistribution, or TPM circumvention.</p>",
          "Enjoy lawfully acquired copies. <strong>Zero Tolerance</strong> for piracy.",
          "પુસ્તકોની અનધિકૃત કૉપિ/વિતરણ સખ્ત પ્રતિબંધિત છે. ફરિયાદ: bhargavsinh.bca@gmail.com."
          ),
          }

          # Policy center hub
          policies["Visitor/policy-center.html"] = f'''
          <h2 class="kicker accent">Official Documentation · V2.0</h2>
          <h1 class="accent">Policy Center</h1>
          <p class="muted"><strong>Effective Date of suite:</strong> {EFF}. All listed policies are <strong>Version 2.0</strong>, prepared for alignment with the IT Act, 2000; IT Rules, 2021; DPDP Act, 2023; Copyright Act, 1957; and Indian Contract Act, 1872.</p>
          <p><strong>Strictly Prohibited:</strong> unauthorised copying, data misuse, and circumvention of content protection. <strong>Zero Tolerance</strong> for wilful violation.</p>
          <h2>Core legal</h2>
          <ul>
          <li><a href="privacy-policy.html">Revised Privacy Policy — Version 2.0</a></li>
          <li><a href="termsofuse.html">Revised Terms of Use — Version 2.0</a></li>
          <li><a href="disclaimer.html">Revised Disclaimer — Version 2.0</a></li>
          <li><a href="grievance.html">Revised Grievance Redressal Policy — Version 2.0</a></li>
          </ul>
          <h2>Data &amp; content</h2>
          <ul>
          <li><a href="cookies-policy.html">Revised Cookies Policy — Version 2.0</a></li>
          <li><a href="copyright-policy.html">Revised Copyright Policy — Version 2.0</a></li>
          <li><a href="content-editorial-policy.html">Revised Content Editorial Policy — Version 2.0</a></li>
          <li><a href="data-retention-policy.html">Revised Data Retention Policy — Version 2.0</a></li>
          <li><a href="third-party-policy.html">Revised Third-Party Policy — Version 2.0</a></li>
          </ul>
          <h2>Access &amp; reading</h2>
          <ul>
          <li><a href="accessibility-statement.html">Revised Accessibility Statement — Version 2.0</a></li>
          <li><a href="../Book-Publications-Reader/bookreadingpolicy.html">Revised Book Reading Policy — Version 2.0</a></li>
          </ul>
          <section class="box">
          <h2 class="accent">Grievance Officer (Rule 3(2), IT Rules 2021)</h2>
          <p><strong>{GO_NAME}</strong> · <a href="mailto:{GO_EMAIL}">{GO_EMAIL}</a> · Acknowledgement within 15 days; resolution endeavour within 30 days.</p>
          </section>
          <p class="muted"><em>Gujarati summary:</em> તમામ નીતિઓ V2.0 હેઠળ ભારતીય કાયદા સાથે સુસંગત બનાવાઈ છે. અનધિકૃત કૉપિ પર શૂન્ય સહિષ્ણુતા; ફરિયાદ: <strong>{GO_EMAIL}</strong>.</p>
          '''

          for path, inner in policies.items():
              p = Path(path)
              if not p.exists():
                  print("missing", path)
                  continue
              html = p.read_text(encoding="utf-8")
              if "data-protect" not in re.search(r"<body[^>]*>", html).group(0):
                  html = re.sub(r"<body([^>]*)>", r"<body\1 data-protect>", html, count=1)
              # Replace main inner
              m = re.search(r"(<main class=\"page\" id=\"main\">)(.*?)(</main>)", html, re.S)
              if not m:
                  print("no main", path)
                  continue
              crumbs = ""
              # keep a simple breadcrumb line inside main
              new_main = m.group(1) + "\n" + inner + "\n" + m.group(3)
              html = html[:m.start()] + new_main + html[m.end():]
              # Title bump
              html = re.sub(r"<title>.*?</title>", "<title>" + re.sub(r"<[^>]+>", "", inner.split("<h1")[1].split("</h1>")[0] if "<h1" in inner else "Policy")[:80] + " | BHARGAVSINH SISODIYA</title>", html, count=1)
              p.write_text(html, encoding="utf-8")
              print("updated", path, len(html))
          print("DONE")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Visitor/*.html Book-Publications-Reader/bookreadingpolicy.html
          git status --short
          git commit -m "V18.1.2: Policy Suite Version 2.0 — IT Act, IT Rules 2021, DPDP Act 2023, Copyright Act, Contract Act" || exit 0
          git push origin HEAD:main
